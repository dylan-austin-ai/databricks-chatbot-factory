[project]
name = "chatbot-factory"
version = "1.0.0"
description = "Governed, self-service RAG chatbots on Databricks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "databricks-sdk>=0.60", "openai>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=4", "numpy>=1.26"]
# Everything the Streamlit app needs at runtime. Mirrors requirements.txt, which
# Databricks Apps installs from; keep the two in step.
app = [
    "streamlit>=1.45",
    "pandas>=2",
    "pillow>=10",
    "pypdf>=4",
    "mlflow-skinny[databricks]>=3.14",
    "opentelemetry-distro>=0.48b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-tornado>=0.48b0",
    "opentelemetry-instrumentation-system-metrics>=0.48b0",
]

# Installed by default with `uv sync`.
[dependency-groups]
dev = ["pytest>=8", "pypdf>=4", "numpy>=1.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factory = ["platform_defaults.yml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
