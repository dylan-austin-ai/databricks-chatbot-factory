# Databricks App runtime config. Bundle resources are injected via valueFrom.
# opentelemetry-instrument exports app spans, logs and metrics to the UC tables set in
# resources/app.yml (Apps telemetry, APP-2); OTLP endpoint variables are injected by Databricks.
command: ["opentelemetry-instrument", "streamlit", "run", "app/app.py", "--server.headless", "true"]
env:
  - name: OTEL_TRACES_SAMPLER
    value: always_on
  - name: FACTORY_CATALOG
    value: chatbots_dev          # set to "chatbots" for the prod deployment
  - name: FACTORY_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: MLFLOW_TRACING_SQL_WAREHOUSE_ID     # user feedback onto UC-stored traces (OBS-10)
    valueFrom: sql-warehouse
  - name: PROVISION_JOB_ID
    valueFrom: provision-job
  - name: INGEST_JOB_ID
    valueFrom: ingest-job
  - name: EVALS_JOB_ID
    valueFrom: evals-job
  - name: REINDEX_JOB_ID
    valueFrom: reindex-job
  - name: PROMOTE_JOB_ID
    valueFrom: promote-job
  - name: OPTIMIZE_JOB_ID
    valueFrom: optimize-job
  - name: MAINTENANCE_JOB_ID
    valueFrom: maintenance-job
  - name: FACTORY_ENV
    value: dev                   # set to "prod" for the prod deployment (picks the traces experiment)
  - name: FACTORY_APP_VERSION
    value: "2.0.0"
