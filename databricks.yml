# Chatbot Factory: Declarative Automation Bundle, formerly Asset Bundle (ADM-1, REL-7: dev and prod for platform code;
# bots themselves are tested as candidate releases inside prod, REL-1).
# Existing resources can be bound instead of recreated (REL-11), e.g.:
#   databricks bundle deployment bind deploy_agent <job_id> -t prod
#   databricks bundle deploy -t dev
#   databricks bundle run setup_platform -t dev
#   databricks bundle run deploy_agent -t dev
bundle:
  name: chatbot-factory
  engine: direct            # Go-SDK deployment engine (Terraform engine is being retired); CLI >= 0.279

include:
  - resources/*.yml

variables:
  catalog:
    description: Predefined catalog that holds one schema per chatbot (PRV-1)
  warehouse_id:
    description: SQL warehouse for app queries and the agent's UC access checks
  admin_group:
    description: MLOps group with admin rights (ADM-8)
    default: mlops
  agent_endpoint:
    default: chatbot-agent
  dev_catalog:
    description: Catalog of the dev environment, read by the prod release gate (CAS-4)
    default: chatbots_dev
  release_gate:
    default: "false"
  agent_principal:
    description: Application ID of the dedicated agent service principal (reads runtime, writes logs)
    default: ""
  usage_policy_id:
    description: >-
      Serverless usage policy (account console > Usage > Usage policies) whose tags land in
      system.billing.usage.custom_tags for every job, the app and the agent endpoint (CST-11)
    default: ""

sync:
  exclude:
    - tests/**
    - "**/__pycache__/**"

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: chatbots_dev
      release_gate: "false"

  prod:
    mode: production
    variables:
      catalog: chatbots
      release_gate: "true"
    permissions:
      - group_name: ${var.admin_group}
        level: CAN_MANAGE
